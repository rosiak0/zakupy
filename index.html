<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wspólna Lista Zakupów i Przepisy</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --completed-color: #64748b;
            --danger-color: #f43f5e;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 2rem;
            letter-spacing: -0.5px;
        }

        .actions-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
        }

        .buttons-group {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 10px;
            align-items: center;
        }

        @media (min-width: 640px) {
            .buttons-group {
                flex-direction: row;
                justify-content: center;
                width: auto;
            }
            .actions-bar {
                flex-direction: row;
                justify-content: space-between;
            }
        }

        .status-indicator {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            text-align: center;
        }
        .status-sync { background-color: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-local { background-color: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-error { background-color: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        @media (min-width: 640px) {
            button {
                width: auto;
            }
        }

        button:hover {
            transform: translateY(-1px);
        }

        button.btn-success {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        button.btn-success:hover {
            background-color: var(--success-color);
            color: #ffffff;
        }

        button.btn-primary {
            background-color: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.4);
        }
        button.btn-primary:hover {
            background-color: #6366f1;
            color: #ffffff;
        }

        button.btn-accent {
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }
        button.btn-accent:hover {
            background-color: var(--accent-color);
            color: #0f172a;
        }

        /* Globalny panel wyszukiwania i dodawania na górze */
        .global-search-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .global-search-bar {
            display: flex;
            gap: 10px;
        }

        .global-search-input {
            flex-grow: 1;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
        }

        .global-search-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* Panel wyboru kategorii dla nowego produktu */
        .global-item-prompt {
            display: none;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.35);
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            gap: 10px;
            flex-direction: column;
        }

        .global-item-prompt.visible {
            display: flex;
        }

        .global-item-prompt p {
            margin: 0;
            font-size: 0.9rem;
            color: #fbbf24;
            font-weight: 600;
        }

        .prompt-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .prompt-controls select {
            padding: 8px 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            flex-grow: 1;
        }

        /* Sekcja Przepisów (zwijana) */
        .recipes-section {
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .recipes-section.open {
            display: block;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .recipes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .recipes-header h2 {
            margin: 0;
            font-size: 1.3rem;
            color: var(--primary-color);
        }

        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .recipe-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }

        .recipe-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--primary-color);
            margin: 0;
        }

        .recipe-ingredients-preview {
            font-size: 0.8rem;
            color: var(--text-muted);
            max-height: 60px;
            overflow-y: auto;
        }

        .recipe-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .recipe-actions button {
            padding: 6px 10px;
            font-size: 0.8rem;
            flex-grow: 1;
        }

        .add-recipe-box {
            background: #0f172a;
            border: 1px dashed var(--border-color);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .add-recipe-box h3 {
            margin-top: 0;
            font-size: 1rem;
            color: var(--primary-color);
        }

        .recipe-form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .recipe-form-row select, .recipe-form-row input {
            padding: 9px 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.9rem;
            flex-grow: 1;
        }

        .temp-ingredients-list {
            list-style: none;
            padding: 0;
            margin: 0 0 12px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .temp-ingredient-tag {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .temp-ingredient-tag span {
            cursor: pointer;
            font-weight: bold;
        }

        /* Siatka kategorii zakupów */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 20px;
        }

        .category-card {
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .category-title-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0;
        }

        .badge-count {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
            max-height: 380px;
            overflow-y: auto;
        }

        .item-list::-webkit-scrollbar {
            width: 5px;
        }
        .item-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.4);
            gap: 8px;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-content {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex-grow: 1;
            min-width: 0; 
        }

        .item-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-color);
            flex-shrink: 0;
        }

        .item-text {
            transition: color 0.2s, opacity 0.2s;
            font-size: 0.95rem;
            word-break: break-word;
            flex-grow: 1;
            min-width: 0;
        }

        .item-text.completed {
            text-decoration: line-through;
            color: var(--completed-color);
            opacity: 0.7;
        }

        .item-actions-inline {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .item-action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 6px;
            opacity: 0.6;
            transition: all 0.2s;
            width: auto;
        }

        .item-action-btn:hover {
            opacity: 1;
            color: var(--accent-color);
        }

        .item-action-btn.delete-btn:hover {
            color: var(--danger-color);
        }

        .add-category-section {
            margin-top: 30px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .add-category-section h3 {
            margin: 0;
            font-size: 1rem;
            color: var(--primary-color);
            width: 100%;
        }

        .add-category-section input {
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            flex-grow: 1;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Wspólna Lista Zakupów</h1>
    </header>

    <div class="actions-bar">
        <div class="buttons-group">
            <button onclick="toggleRecipesSection()" id="toggleRecipesBtn" class="btn-accent">🍲 Dania i Przepisy</button>
            <button onclick="syncWithCloud(true)" class="btn-success">Odśwież / Pobierz</button>
            <button onclick="startNewShopping()" class="btn-primary">Nowe zakupy (zaznacz wszystkie)</button>
        </div>
        <div id="syncStatus" class="status-indicator status-local">Tryb lokalny (skonfiguruj JSONBin)</div>
    </div>

    <!-- JEDNO GŁÓWNE OKIENKO WYSZUKIWANIA I DODAWANIA NA GÓRZE -->
    <div class="global-search-container">
        <div class="global-search-bar">
            <input type="text" id="globalSearchInput" list="globalSearchList" class="global-search-input" placeholder="🔍 Szukaj artykułu, odznaczaj lub wpisz nowy..." onkeydown="if(event.key==='Enter'){event.preventDefault(); handleGlobalSearchInput();}">
            <datalist id="globalSearchList"></datalist>
            <button type="button" onclick="handleGlobalSearchInput()" class="btn-primary">Dodaj / Odznacz</button>
        </div>

        <!-- Panel wyboru kategorii dla nowego produktu -->
        <div class="global-item-prompt" id="globalItemPrompt">
            <p id="globalItemPromptLabel">Nowy produkt! Wybierz kategorię na liście zakupów:</p>
            <div class="prompt-controls">
                <select id="globalItemCategorySelect"></select>
                <button type="button" onclick="confirmGlobalItem()" class="btn-success">Dodaj do kategorii</button>
                <button type="button" onclick="cancelGlobalItem()" class="item-action-btn delete-btn">Anuluj</button>
            </div>
        </div>
    </div>

    <!-- ZWIJANA SEKCJA PRZEPISÓW -->
    <div class="recipes-section" id="recipesSection">
        <div class="recipes-header">
            <h2 id="recipesSectionTitle">🍲 Moje Dania i Przepisy</h2>
            <button onclick="toggleRecipesSection()" class="item-action-btn" title="Zwiń panel" style="font-size: 1.4rem;">&times;</button>
        </div>
        
        <div class="recipes-grid" id="recipesGrid">
            <!-- Rendered via JS -->
        </div>

        <div class="add-recipe-box">
            <h3 id="recipeFormHeader">Dodaj nowe danie / przepis</h3>
            <div class="recipe-form-row">
                <input type="text" id="newRecipeName" placeholder="Nazwa dania (np. Spaghetti Carbonara)...">
            </div>
            <div class="recipe-form-row">
                <input type="text" id="recipeIngredientInput" list="globalIngredientsList" placeholder="Składnik (szuka we wszystkich kategoriach)..." onkeydown="if(event.key==='Enter'){event.preventDefault(); handleAddRecipeIngredient();}">
                <datalist id="globalIngredientsList"></datalist>
                <button type="button" onclick="handleAddRecipeIngredient()" class="btn-primary">+ Dodaj składnik</button>
            </div>

            <div class="global-item-prompt" id="newItemCategoryPrompt">
                <p id="newItemPromptLabel">Nowy produkt! Wybierz kategorię:</p>
                <div class="prompt-controls">
                    <select id="newItemCategorySelect"></select>
                    <button type="button" onclick="confirmNewIngredientCategory()" class="btn-success">Potwierdź</button>
                    <button type="button" onclick="cancelNewIngredientCategory()" class="item-action-btn delete-btn">Anuluj</button>
                </div>
            </div>

            <ul class="temp-ingredients-list" id="tempIngredientsList">
                <span style="color: var(--text-muted); font-size: 0.85rem;">Brak składników w tym przepisie. Wpisz składnik powyżej.</span>
            </ul>
            
            <div style="display: flex; gap: 10px;">
                <button type="button" onclick="saveNewRecipe()" id="saveRecipeBtn" class="btn-success" style="flex-grow: 1;">Zapisz przepis</button>
                <button type="button" onclick="cancelEditRecipe()" id="cancelEditBtn" class="item-action-btn delete-btn" style="display: none; padding: 10px 15px; background: rgba(244, 63, 94, 0.15); border-radius: 8px;">Anuluj edycję</button>
            </div>
        </div>
    </div>

    <!-- SEKCJA LISTY ZAKUPÓW -->
    <div class="categories-grid" id="categoriesGrid">
        <!-- Rendered via JS -->
    </div>

    <div class="add-category-section">
        <h3>Dodaj nową kategorię</h3>
        <input type="text" id="newCategoryName" placeholder="Nazwa kategorii (np. Chemia domowa)...">
        <button onclick="addNewCategory()" class="btn-primary">Dodaj kategorię</button>
    </div>
</div>
