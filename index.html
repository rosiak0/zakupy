<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wspólna Lista Zakupów i Przepisy</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --completed-color: #64748b;
            --danger-color: #f43f5e;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 2rem;
            letter-spacing: -0.5px;
        }

        .actions-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
        }

        .buttons-group {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 10px;
            align-items: center;
        }

        @media (min-width: 640px) {
            .buttons-group {
                flex-direction: row;
                justify-content: center;
                width: auto;
            }
            .actions-bar {
                flex-direction: row;
                justify-content: space-between;
            }
        }

        .status-indicator {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            text-align: center;
        }
        .status-sync { background-color: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-local { background-color: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-error { background-color: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        @media (min-width: 640px) {
            button {
                width: auto;
            }
        }

        button:hover {
            transform: translateY(-1px);
        }

        button.btn-success {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        button.btn-success:hover {
            background-color: var(--success-color);
            color: #ffffff;
        }

        button.btn-primary {
            background-color: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.4);
        }
        button.btn-primary:hover {
            background-color: #6366f1;
            color: #ffffff;
        }

        button.btn-accent {
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }
        button.btn-accent:hover {
            background-color: var(--accent-color);
            color: #0f172a;
        }

        /* Globalny panel wyszukiwania i dodawania na górze */
        .global-search-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .global-search-bar {
            display: flex;
            gap: 10px;
        }

        .global-search-input {
            flex-grow: 1;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
        }

        .global-search-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* Panel wyboru kategorii dla nowego produktu */
        .global-item-prompt {
            display: none;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.35);
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            gap: 10px;
            flex-direction: column;
        }

        .global-item-prompt.visible {
            display: flex;
        }

        .global-item-prompt p {
            margin: 0;
            font-size: 0.9rem;
            color: #fbbf24;
            font-weight: 600;
        }

        .prompt-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .prompt-controls select {
            padding: 8px 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            flex-grow: 1;
        }

        /* Sekcja Przepisów (zwijana) */
        .recipes-section {
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .recipes-section.open {
            display: block;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .recipes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .recipes-header h2 {
            margin: 0;
            font-size: 1.3rem;
            color: var(--primary-color);
        }

        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .recipe-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }

        .recipe-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--primary-color);
            margin: 0;
        }

        .recipe-ingredients-preview {
            font-size: 0.8rem;
            color: var(--text-muted);
            max-height: 60px;
            overflow-y: auto;
        }

        .recipe-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .recipe-actions button {
            padding: 6px 10px;
            font-size: 0.8rem;
            flex-grow: 1;
        }

        .add-recipe-box {
            background: #0f172a;
            border: 1px dashed var(--border-color);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .add-recipe-box h3 {
            margin-top: 0;
            font-size: 1rem;
            color: var(--primary-color);
        }

        .recipe-form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .recipe-form-row select, .recipe-form-row input {
            padding: 9px 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.9rem;
            flex-grow: 1;
        }

        .temp-ingredients-list {
            list-style: none;
            padding: 0;
            margin: 0 0 12px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .temp-ingredient-tag {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .temp-ingredient-tag span {
            cursor: pointer;
            font-weight: bold;
        }

        /* Siatka kategorii zakupów */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 20px;
        }

        .category-card {
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .category-title-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0;
        }

        .badge-count {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
            max-height: 380px;
            overflow-y: auto;
        }

        .item-list::-webkit-scrollbar {
            width: 5px;
        }
        .item-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.4);
            gap: 8px;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-content {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex-grow: 1;
            min-width: 0; 
        }

        .item-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-color);
            flex-shrink: 0;
        }

        .item-text {
            transition: color 0.2s, opacity 0.2s;
            font-size: 0.95rem;
            word-break: break-word;
            flex-grow: 1;
            min-width: 0;
        }

        .item-text.completed {
            text-decoration: line-through;
            color: var(--completed-color);
            opacity: 0.7;
        }

        .item-actions-inline {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .item-action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 6px;
            opacity: 0.6;
            transition: all 0.2s;
            width: auto;
        }

        .item-action-btn:hover {
            opacity: 1;
            color: var(--accent-color);
        }

        .item-action-btn.delete-btn:hover {
            color: var(--danger-color);
        }

        .add-category-section {
            margin-top: 30px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .add-category-section h3 {
            margin: 0;
            font-size: 1rem;
            color: var(--primary-color);
            width: 100%;
        }

        .add-category-section input {
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            flex-grow: 1;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Wspólna Lista Zakupów</h1>
    </header>

    <div class="actions-bar">
        <div class="buttons-group">
            <button onclick="toggleRecipesSection()" id="toggleRecipesBtn" class="btn-accent">🍲 Dania i Przepisy</button>
            <button onclick="syncWithCloud(true)" class="btn-success">Odśwież / Pobierz</button>
            <button onclick="startNewShopping()" class="btn-primary">Nowe zakupy (zaznacz wszystkie)</button>
        </div>
        <div id="syncStatus" class="status-indicator status-local">Tryb lokalny (skonfiguruj JSONBin)</div>
    </div>

    <!-- JEDNO GŁÓWNE OKIENKO WYSZUKIWANIA I DODAWANIA NA GÓRZE -->
    <div class="global-search-container">
        <div class="global-search-bar">
            <input type="text" id="globalSearchInput" list="globalSearchList" class="global-search-input" placeholder="🔍 Szukaj artykułu, odznaczaj lub wpisz nowy..." onkeydown="if(event.key==='Enter'){event.preventDefault(); handleGlobalSearchInput();}">
            <datalist id="globalSearchList"></datalist>
            <button type="button" onclick="handleGlobalSearchInput()" class="btn-primary">Dodaj / Odznacz</button>
        </div>

        <!-- Panel wyboru kategorii dla nowego produktu -->
        <div class="global-item-prompt" id="globalItemPrompt">
            <p id="globalItemPromptLabel">Nowy produkt! Wybierz kategorię na liście zakupów:</p>
            <div class="prompt-controls">
                <select id="globalItemCategorySelect"></select>
                <button type="button" onclick="confirmGlobalItem()" class="btn-success">Dodaj do kategorii</button>
                <button type="button" onclick="cancelGlobalItem()" class="item-action-btn delete-btn">Anuluj</button>
            </div>
        </div>
    </div>

    <!-- ZWIJANA SEKCJA PRZEPISÓW -->
    <div class="recipes-section" id="recipesSection">
        <div class="recipes-header">
            <h2 id="recipesSectionTitle">🍲 Moje Dania i Przepisy</h2>
            <button onclick="toggleRecipesSection()" class="item-action-btn" title="Zwiń panel" style="font-size: 1.4rem;">&times;</button>
        </div>
        
        <div class="recipes-grid" id="recipesGrid">
            <!-- Rendered via JS -->
        </div>

        <div class="add-recipe-box">
            <h3 id="recipeFormHeader">Dodaj nowe danie / przepis</h3>
            <div class="recipe-form-row">
                <input type="text" id="newRecipeName" placeholder="Nazwa dania (np. Spaghetti Carbonara)...">
            </div>
            <div class="recipe-form-row">
                <input type="text" id="recipeIngredientInput" list="globalIngredientsList" placeholder="Składnik (szuka we wszystkich kategoriach)..." onkeydown="if(event.key==='Enter'){event.preventDefault(); handleAddRecipeIngredient();}">
                <datalist id="globalIngredientsList"></datalist>
                <button type="button" onclick="handleAddRecipeIngredient()" class="btn-primary">+ Dodaj składnik</button>
            </div>

            <div class="global-item-prompt" id="newItemCategoryPrompt">
                <p id="newItemPromptLabel">Nowy produkt! Wybierz kategorię:</p>
                <div class="prompt-controls">
                    <select id="newItemCategorySelect"></select>
                    <button type="button" onclick="confirmNewIngredientCategory()" class="btn-success">Potwierdź</button>
                    <button type="button" onclick="cancelNewIngredientCategory()" class="item-action-btn delete-btn">Anuluj</button>
                </div>
            </div>

            <ul class="temp-ingredients-list" id="tempIngredientsList">
                <span style="color: var(--text-muted); font-size: 0.85rem;">Brak składników w tym przepisie. Wpisz składnik powyżej.</span>
            </ul>
            
            <div style="display: flex; gap: 10px;">
                <button type="button" onclick="saveNewRecipe()" id="saveRecipeBtn" class="btn-success" style="flex-grow: 1;">Zapisz przepis</button>
                <button type="button" onclick="cancelEditRecipe()" id="cancelEditBtn" class="item-action-btn delete-btn" style="display: none; padding: 10px 15px; background: rgba(244, 63, 94, 0.15); border-radius: 8px;">Anuluj edycję</button>
            </div>
        </div>
    </div>

    <!-- SEKCJA LISTY ZAKUPÓW -->
    <div class="categories-grid" id="categoriesGrid">
        <!-- Rendered via JS -->
    </div>

    <div class="add-category-section">
        <h3>Dodaj nową kategorię</h3>
        <input type="text" id="newCategoryName" placeholder="Nazwa kategorii (np. Chemia domowa)...">
        <button onclick="addNewCategory()" class="btn-primary">Dodaj kategorię</button>
    </div>
</div>

function isConfigured() {
    return BIN_ID && BIN_ID !== 'TUTAJ_WKLEJ_SWOJ_BIN_ID' && API_KEY && !API_KEY.includes('TUTAJ_WKLEJ');
}

function updateStatus(text, type) {
    const el = document.getElementById('syncStatus');
    el.textContent = text;
    el.className = `status-indicator status-${type}`;
}

function toggleRecipesSection() {
    const sec = document.getElementById('recipesSection');
    const btn = document.getElementById('toggleRecipesBtn');
    sec.classList.toggle('open');
    if (sec.classList.contains('open')) {
        btn.textContent = '🍲 Ukryj Przepisy';
    } else {
        btn.textContent = '🍲 Dania i Przepisy';
    }
}

async function syncWithCloud(showAlert = false) {
    if (!isConfigured()) {
        loadLocalFallback();
        if (showAlert) alert("Chmura JSONBin nie jest skonfigurowana. Uzupełnij zmienne BIN_ID i API_KEY w kodzie.");
        return;
    }

    updateStatus("Pobieranie z chmury...", "local");
    try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': API_KEY }
        });
        if (!response.ok) throw new Error("Błąd sieci");
        const resData = await response.json();
        if (resData && resData.record) {
            if (resData.record.shopping) {
                shoppingData = resData.record.shopping;
                recipesData = resData.record.recipes || initialRecipes;
            } else {
                shoppingData = resData.record;
                recipesData = initialRecipes;
            }
            saveLocal();
            render();
            updateStatus("Zsynchronizowano z chmurą", "sync");
            if (showAlert) alert("Dane zostały pobrane i zsynchronizowane!");
        }
    } catch (e) {
        updateStatus("Błąd synchronizacji (tryb offline)", "error");
        loadLocalFallback();
        if (showAlert) alert("Nie udało się połączyć z chmurą. Załadowano wersję lokalną.");
    }
}

async function saveToCloud() {
    saveLocal(); 
    if (!isConfigured()) return;

    try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': API_KEY
            },
            body: JSON.stringify({ shopping: shoppingData, recipes: recipesData })
        });
        updateStatus("Zsynchronizowano z chmurą", "sync");
    } catch (e) {
        updateStatus("Zapisano lokalnie (błąd chmury)", "error");
    }
}

function loadLocalFallback() {
    const savedShopping = localStorage.getItem('app_shopping_data_v22');
    const savedRecipes = localStorage.getItem('app_recipes_data_v22');

    shoppingData = savedShopping ? JSON.parse(savedShopping) : JSON.parse(JSON.stringify(initialData));
    recipesData = savedRecipes ? JSON.parse(savedRecipes) : JSON.parse(JSON.stringify(initialRecipes));
    
    render();
    if (!isConfigured()) {
        updateStatus("Tryb lokalny (skonfiguruj JSONBin)", "local");
    }
}

function saveLocal() {
    localStorage.setItem('app_shopping_data_v22', JSON.stringify(shoppingData));
    localStorage.setItem('app_recipes_data_v22', JSON.stringify(recipesData));
}

// Globalne autouzupełnianie
function updateAllAutocompletes() {
    const globalDatalist = document.getElementById('globalSearchList');
    const globalCatSelect = document.getElementById('globalItemCategorySelect');
    
    const recipeDatalist = document.getElementById('globalIngredientsList');
    const recipeCatSelect = document.getElementById('newItemCategorySelect');

    if (!globalDatalist || !globalCatSelect) return;

    globalDatalist.innerHTML = '';
    globalCatSelect.innerHTML = '';
    if (recipeDatalist) recipeDatalist.innerHTML = '';
    if (recipeCatSelect) recipeCatSelect.innerHTML = '';

    Object.keys(shoppingData).forEach(cat => {
        const opt1 = document.createElement('option');
        opt1.value = cat;
        opt1.textContent = cat;
        globalCatSelect.appendChild(opt1);

        if (recipeCatSelect) {
            const opt2 = document.createElement('option');
            opt2.value = cat;
            opt2.textContent = cat;
            recipeCatSelect.appendChild(opt2);
        }

        if (shoppingData[cat]) {
            shoppingData[cat].forEach(item => {
                let itemName = typeof item === 'string' ? item : item.name;
                
                const optGlobal = document.createElement('option');
                optGlobal.value = `${itemName} [${cat}]`;
                globalDatalist.appendChild(optGlobal);

                if (recipeDatalist) {
                    const optRecipe = document.createElement('option');
                    optRecipe.value = `${itemName} [${cat}]`;
                    recipeDatalist.appendChild(optRecipe);
                }
            });
        }
    });
}

// Główny pasek wyszukiwania / odznaczania / dodawania
function handleGlobalSearchInput() {
    const input = document.getElementById('globalSearchInput');
    const rawVal = input.value.trim();
    if (!rawVal) return;

    const bracketMatch = rawVal.match(/^(.*)\s+\[(.*)\]$/);
    if (bracketMatch) {
        const extractedName = bracketMatch[1].trim();
        const extractedCat = bracketMatch[2].trim();
        if (shoppingData[extractedCat]) {
            let items = shoppingData[extractedCat].map(i => typeof i === 'string' ? { name: i, completed: false } : i);
            let existing = items.find(i => i.name.toLowerCase() === extractedName.toLowerCase());
            if (existing) {
                existing.completed = false; 
            } else {
                items.push({ name: extractedName, completed: false });
            }
            shoppingData[extractedCat] = items;
            input.value = '';
            cancelGlobalItem();
            saveToCloud();
            render();
            return;
        }
    }

    let foundCat = null;
    let exactName = rawVal;

    for (const cat of Object.keys(shoppingData)) {
        let items = shoppingData[cat].map(i => typeof i === 'string' ? { name: i, completed: false } : i);
        const match = items.find(i => i.name.toLowerCase() === rawVal.toLowerCase());
        if (match) {
            foundCat = cat;
            exactName = match.name;
            break;
        }
    }

    if (foundCat) {
        let items = shoppingData[foundCat].map(i => typeof i === 'string' ? { name: i, completed: false } : i);
        let existing = items.find(i => i.name.toLowerCase() === exactName.toLowerCase());
        if (existing) {
            existing.completed = false; 
        }
        shoppingData[foundCat] = items;
        input.value = '';
        cancelGlobalItem();
        saveToCloud();
        render();
    } else {
        pendingGlobalItemName = rawVal;
        document.getElementById('globalItemPromptLabel').textContent = `Produkt "${rawVal}" nie istnieje. Wybierz kategorię, do której go dodać:`;
        document.getElementById('globalItemPrompt').classList.add('visible');
    }
}

function confirmGlobalItem() {
    if (!pendingGlobalItemName) return;
    const cat = document.getElementById('globalItemCategorySelect').value;
    
    if (!shoppingData[cat]) shoppingData[cat] = [];
    let items = shoppingData[cat].map(i => typeof i === 'string' ? { name: i, completed: false } : i);
    
    items.push({ name: pendingGlobalItemName, completed: false });
    shoppingData[cat] = items;

    pendingGlobalItemName = "";
    document.getElementById('globalSearchInput').value = '';
    document.getElementById('globalItemPrompt').classList.remove('visible');
    saveToCloud();
    render();
}

function cancelGlobalItem() {
    pendingGlobalItemName = "";
    document.getElementById('globalItemPrompt').classList.remove('visible');
}

    document.getElementById('saveRecipeBtn').textContent = 'Zapisz przepis';
    document.getElementById('cancelEditBtn').style.display = 'none';

}

function handleAddRecipeIngredient() {
    const input = document.getElementById('recipeIngredientInput');
    const rawVal = input.value.trim();
    if (!rawVal) return;

    const bracketMatch = rawVal.match(/^(.*)\s+\[(.*)\]$/);
    if (bracketMatch) {
        const extractedName = bracketMatch[1].trim();
        const extractedCat = bracketMatch[2].trim();
        if (shoppingData[extractedCat]) {
            tempRecipeIngredients.push({ category: extractedCat, name: extractedName });
            input.value = '';
            cancelNewIngredientCategory();
            renderTempIngredients();
            return;
        }
    }

    let foundCat = null;
    let exactName = rawVal;

    for (const cat of Object.keys(shoppingData)) {
        const match = shoppingData[cat].find(i => {
            const name = typeof i === 'string' ? i : i.name;
            return name.toLowerCase() === rawVal.toLowerCase();
        });
        if (match) {
            foundCat = cat;
            exactName = typeof match === 'string' ? match : match.name;
            break;
        }
    }

    if (foundCat) {
        tempRecipeIngredients.push({ category: foundCat, name: exactName });
        input.value = '';
        cancelNewIngredientCategory();
        renderTempIngredients();
    } else {
        pendingNewIngredientName = rawVal;
        document.getElementById('newItemPromptLabel').textContent = `Produkt "${rawVal}" nie istnieje. Wybierz kategorię:`;
        document.getElementById('newItemCategoryPrompt').classList.add('visible');
    }
}

function confirmNewIngredientCategory() {
    if (!pendingNewIngredientName) return;
    const cat = document.getElementById('newItemCategorySelect').value;
    tempRecipeIngredients.push({ category: cat, name: pendingNewIngredientName });
    pendingNewIngredientName = "";
    document.getElementById('recipeIngredientInput').value = '';
    document.getElementById('newItemCategoryPrompt').classList.remove('visible');
    renderTempIngredients();
}

function cancelNewIngredientCategory() {
    pendingNewIngredientName = "";
    document.getElementById('newItemCategoryPrompt').classList.remove('visible');
}

function removeTempIngredient(index) {
    tempRecipeIngredients.splice(index, 1);
    renderTempIngredients();
}

function renderTempIngredients() {
    const list = document.getElementById('tempIngredientsList');
    if (!list) return;
    if (tempRecipeIngredients.length === 0) {
        list.innerHTML = '<span style="color: var(--text-muted); font-size: 0.85rem;">Brak składników w tym przepisie. Wpisz składnik powyżej.</span>';
        return;
    }
    list.innerHTML = '';
    tempRecipeIngredients.forEach((ing, idx) => {
        const li = document.createElement('li');
        li.className = 'temp-ingredient-tag';
        li.innerHTML = `[${ing.category.split(' ')[0]}] ${escapeHtml(ing.name)} <span onclick="removeTempIngredient(${idx})">&times;</span>`;
        list.appendChild(li);
    });
}

function saveNewRecipe() {
    const nameInput = document.getElementById('newRecipeName');
    const recipeName = nameInput.value.trim();
    if (!recipeName) {
        alert("Podaj nazwę przepisu!");
        return;
    }
    if (tempRecipeIngredients.length === 0) {
        alert("Dodaj przynajmniej jeden składnik do przepisu!");
        return;
    }

    if (editingRecipeName && editingRecipeName !== recipeName) {
        delete recipesData[editingRecipeName];
    }

    recipesData[recipeName] = [...tempRecipeIngredients];
    
    // Reset formularza
    cancelEditRecipe();
    saveToCloud();
    render();
}

function deleteRecipe(recipeName) {
    if (confirm(`Usunąć przepis "${recipeName}"?`)) {
        if (editingRecipeName === recipeName) {
            cancelEditRecipe();
        }
        delete recipesData[recipeName];
        saveToCloud();
        render();
    }
}

function addToShopping(recipeName) {
    const ingredients = recipesData[recipeName];
    if (!ingredients) return;

    ingredients.forEach(ing => {
        let cat = ing.category;
        let ingName = ing.name;

        if (!shoppingData[cat]) {
            shoppingData[cat] = [];
        }

        shoppingData[cat] = shoppingData[cat].map(i => typeof i === 'string' ? { name: i, completed: false } : i);

        let existing = shoppingData[cat].find(i => i.name.toLowerCase() === ingName.toLowerCase());
        if (existing) {
            existing.completed = false; 
        } else {
            shoppingData[cat].push({ name: ingName, completed: false }); 
        }
    });

    saveToCloud();
    render();
    alert(`Składniki z przepisu "${recipeName}" zostały dodane / odznaczone na liście zakupów!`);
}

// Standardowe akcje listy zakupów
function startNewShopping() {
    if (confirm("Rozpocząć nowe zakupy? Wszystkie artykuły zostaną zaznaczone (skreślone), aby można je było odznaczać w trakcie zakupów.")) {
        Object.keys(shoppingData).forEach(cat => {
            shoppingData[cat] = shoppingData[cat].map(i => {
                let name = typeof i === 'string' ? i : i.name;
                return { name: name, completed: true };
            });
        });
        saveToCloud();
        render();
    }
}

function toggleItem(category, index) {
    let items = shoppingData[category].map(i => typeof i === 'string' ? { name: i, completed: false } : i);
    items[index].completed = !items[index].completed;
    shoppingData[category] = items;
    saveToCloud();
    render();
}

function editItem(category, index) {
    let items = shoppingData[category].map(i => typeof i === 'string' ? { name: i, completed: false } : i);
    let currentName = items[index].name;
    let newName = prompt("Edytuj nazwę artykułu:", currentName);
    if (newName !== null) {
        newName = newName.trim();
        if (newName !== "") {
            items[index].name = newName;
            shoppingData[category] = items;
            saveToCloud();
            render();
        }
    }
}

function deleteItem(category, index) {
    let items = shoppingData[category].map(i => typeof i === 'string' ? { name: i, completed: false } : i);
    items.splice(index, 1);
    shoppingData[category] = items;
    saveToCloud();
    render();
}

function addNewCategory() {
    const input = document.getElementById('newCategoryName');
    const catName = input.value.trim();
    if (catName) {
        if (shoppingData[catName]) {
            alert("Taka kategoria już istnieje!");
            return;
        }
        shoppingData[catName] = [];
        input.value = '';
        saveToCloud();
        render();
    }
}

function render() {
    updateAllAutocompletes();

    // Renderowanie przepisów
    const recipesGrid = document.getElementById('recipesGrid');
    recipesGrid.innerHTML = '';
    const recipeKeys = Object.keys(recipesData);

    if (recipeKeys.length === 0) {
        recipesGrid.innerHTML = '<span style="color: var(--text-muted); font-size: 0.9rem;">Brak zapisanych przepisów.</span>';
    } else {
        recipeKeys.forEach(rName => {
            const ingList = recipesData[rName].map(i => i.name).join(', ');
            const card = document.createElement('div');
            card.className = 'recipe-card';
            card.innerHTML = `
                <div>
                    <h3 class="recipe-title">${escapeHtml(rName)}</h3>
                    <div class="recipe-ingredients-preview">Składniki: ${escapeHtml(ingList)}</div>
                </div>
                <div class="recipe-actions">
                    <button onclick="addToShopping('${rName.replace(/'/g, "\\'")}')" class="btn-success">Dodaj do zakupów</button>
                    <button onclick="editRecipe('${rName.replace(/'/g, "\\'")}')" class="btn-primary">Edytuj</button>
                    <button onclick="deleteRecipe('${rName.replace(/'/g, "\\'")}')" class="item-action-btn delete-btn" title="Usuń przepis">&times;</button>
                </div>
            `;
            recipesGrid.appendChild(card);
        });
    }

    // Renderowanie listy zakupów
    const grid = document.getElementById('categoriesGrid');
    grid.innerHTML = '';

    Object.keys(shoppingData).forEach((category) => {
        let items = shoppingData[category] || [];
        items = items.map(item => typeof item === 'string' ? { name: item, completed: false } : item);

        items.sort((a, b) => {
            if (a.completed !== b.completed) return a.completed ? 1 : -1;
            return a.name.localeCompare(b.name, 'pl', { sensitivity: 'base' });
        });
        shoppingData[category] = items;

        const card = document.createElement('div');
        card.className = 'category-card';

        const remainingCount = items.filter(i => !i.completed).length;
        const totalCount = items.length;

        let itemsHtml = '';
        items.forEach((item, index) => {
            const completedClass = item.completed ? 'completed' : '';
            const checkedAttr = item.completed ? 'checked' : '';
            itemsHtml += `
                <li class="item-row">
                    <div class="item-content" onclick="toggleItem('${category.replace(/'/g, "\\'")}', ${index})">
                        <input type="checkbox" class="item-checkbox" ${checkedAttr} onclick="event.stopPropagation(); toggleItem('${category.replace(/'/g, "\\'")}', ${index})">
                        <span class="item-text ${completedClass}" title="Kliknij dwukrotnie, aby edytować" ondblclick="event.stopPropagation(); editItem('${category.replace(/'/g, "\\'")}', ${index})">${escapeHtml(item.name)}</span>
                    </div>
                    <div class="item-actions-inline">
                        <button class="item-action-btn" title="Edytuj nazwę" onclick="editItem('${category.replace(/'/g, "\\'")}', ${index})">✏️</button>
                        <button class="item-action-btn delete-btn" title="Usuń artykuł" onclick="deleteItem('${category.replace(/'/g, "\\'")}', ${index})">&times;</button>
                    </div>
                </li>
            `;
        });

        card.innerHTML = `
            <div class="category-header">
                <div class="category-title-wrapper">
                    <h2 class="category-title">${escapeHtml(category)}</h2>
                    <span class="badge-count">Do kupienia: ${remainingCount} / ${totalCount}</span>
                </div>
            </div>
            <ul class="item-list">
                ${itemsHtml || '<li style="color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 10px;">Brak artykułów</li>'}
            </ul>
        `;

        grid.appendChild(card);
    });
}

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

loadLocalFallback();
if (isConfigured()) {
    syncWithCloud(false);
}
</script>
